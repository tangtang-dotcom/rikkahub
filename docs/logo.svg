<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="50%" stop-color="#A29BFE"/>
      <stop offset="100%" stop-color="#00CEC9"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00CEC9"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块 -->
  <rect width="200" height="200" rx="44" fill="url(#bg)"/>

  <!-- 外圈装饰环 -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- 机器人头部 -->
  <rect x="42" y="48" width="116" height="90" rx="20" fill="rgba(255,255,255,0.96)"/>

  <!-- 天线 -->
  <rect x="92" y="20" width="16" height="28" rx="8" fill="rgba(255,255,255,0.85)"/>
  <circle cx="100" cy="18" r="10" fill="#FD79A8"/>
  <circle cx="97" cy="15" r="3.5" fill="rgba(255,255,255,0.6)"/>

  <!-- 信号弧 -->
  <path d="M 100 8 Q 108 2 114 8" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 2 Q 114 -4 124 2" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 耳朵 -->
  <rect x="27" y="78" width="15" height="30" rx="7" fill="rgba(255,255,255,0.75)"/>
  <rect x="158" y="78" width="15" height="30" rx="7" fill="rgba(255,255,255,0.75)"/>

  <!-- 眼睛 -->
  <ellipse cx="72" cy="88" rx="13" ry="14" fill="#2D3436"/>
  <ellipse cx="128" cy="88" rx="13" ry="14" fill="#2D3436"/>

  <!-- 眼睛发光内圈 -->
  <ellipse cx="72" cy="88" rx="8" ry="9" fill="url(#eyeGlow)" opacity="0.15"/>
  <ellipse cx="128" cy="88" rx="8" ry="9" fill="url(#eyeGlow)" opacity="0.15"/>

  <!-- 眼睛高光 -->
  <circle cx="68" cy="83" r="5" fill="white"/>
  <circle cx="124" cy="83" r="5" fill="white"/>
  <circle cx="76" cy="92" r="2" fill="rgba(255,255,255,0.4)"/>
  <circle cx="132" cy="92" r="2" fill="rgba(255,255,255,0.4)"/>

  <!-- 嘴巴（微笑弧线） -->
  <path d="M 72 112 Q 100 126 128 112" stroke="#00CEC9" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- 嘴部装饰点 -->
  <circle cx="86" cy="117" r="2.5" fill="#00CEC9" opacity="0.5"/>
  <circle cx="100" cy="120" r="2.5" fill="#00CEC9" opacity="0.5"/>
  <circle cx="114" cy="117" r="2.5" fill="#00CEC9" opacity="0.5"/>
</svg>
