name: 编译 APK · Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '自定义 Release tag（默认取 versionName，如 2.4.5-beta.1）'
        required: false
        type: string
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle（依赖/编译缓存，加速构建）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 安装 bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

      - name: 固定签名构建 (overwrite-install)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$HOME/rikkahub.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "storeFile=$KEYSTORE" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --parallel --configure-on-demand

      - name: 重命名 APK（RikkaHub-Agents-架构命名）
        run: |
          cd app/build/outputs/apk/release
          for apk in app-*.apk; do
            [ -f "$apk" ] && mv "$apk" "RikkaHub-Agents-${apk#app-}" || true
          done

      - name: 上传 APK 到 Release
        # 仅 workflow_dispatch（手动填 release_tag）创建/上传 Release；push 只构建验证，防覆盖已有 Release
        if: github.event_name == 'workflow_dispatch'
        run: |
          # 动态读取 versionName 作为默认 tag，可用 workflow_dispatch 的 release_tag 覆盖
          DEFAULT_TAG=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          TAG="${RELEASE_TAG:-$DEFAULT_TAG}"
          echo "Release TAG: $TAG"
          # Release 不存在则创建（避免 release not found）——保持统一样式
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "🚀 RikkaHub Agents $TAG" \
            --notes "## ✨ v$TAG

            ### 📦 安装包
            - ARM64 优化包
            - Universal 通用包" || true
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            # 资产重命名：app-* → RikkaHub-Agents-*
            newname=$(echo "$apk" | sed 's/^app-/RikkaHub-Agents-/')
            mv "$apk" "$newname"
            gh release upload "$TAG" "$newname" --clobber
            echo "Uploaded $newname"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: 上传 APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: app/build/outputs/apk/release/*.apk

      - name: 构建失败通知（Server酱）
        if: failure()
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SC_KEY" ]; then
            echo "未配置 SERVERCHAN_KEY，跳过通知"
            exit 0
          fi
          MSG="RikkaHub Agents 构建失败 #${{ github.run_number }}"
          DESP="commit: ${{ github.sha }}%0A%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://sctapi.ftqq.com/${SC_KEY}.send" \
            -d "title=${MSG}" -d "desp=${DESP}" | head -c 200
          echo
