name: 编译 APK · Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

      - name: 固定签名构建 (overwrite-install)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$HOME/rikkahub.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "storeFile=$KEYSTORE" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 上传 APK 到 Release
        run: |
          TAG="2.4.3"
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            name=$(echo "$apk" | sed 's/app-/rikkahub-agents-'"$TAG"'-/')
            gh release upload "$TAG" "$apk" --clobber
            echo "Uploaded $name"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: app/build/outputs/apk/release/*.apk

      - name: 同步 APK 到 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          TAG="2.4.3"
          GITEE_REPO="choosesheng/rikkahub-agents"
          cd app/build/outputs/apk/release
          # 创建/更新 Gitee Release
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"RikkaHub Agents ${TAG}\",\"body\":\"自动编译版本\"}" > /dev/null
          # 获取 Release ID
          RELEASE_ID=$(curl -s -H "Authorization: token ${GITEE_TOKEN}" \
            "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/tags/${TAG}" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("id",""))')
          # 上传 APK
          for apk in *.apk; do
            name=$(echo "$apk" | sed 's/app-/rikkahub-agents-'"${TAG}"'-/')
            curl -s -X POST \
              -H "Authorization: token ${GITEE_TOKEN}" \
              "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${RELEASE_ID}/attach_files" \
              -F "file=@${apk}" > /dev/null 2>&1
            echo "Synced ${name} to Gitee"
          done