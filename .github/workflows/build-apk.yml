name: 编译 APK · Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secrets: KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/rikkahub.jks"
          {
            echo "storeFile=$HOME/rikkahub.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > local.properties

      - name: Build signed Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Notify build status
        if: always() && (github.actor == 'xiwangone' || github.actor == 'github-actions[bot]')
        env:
          STATUS: ${{ job.status }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SERVERCHAN_KEY" ]; then
            echo "SERVERCHAN_KEY not set; skip notification"
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            TITLE="RikkaHub Agents: manual build OK"
            CONTENT="APK uploaded as workflow artifact.%0A%0Ahttps://github.com/xiwangone/rikkahub-agents/actions/runs/${{ github.run_id }}"
          else
            TITLE="RikkaHub Agents: manual build failed"
            CONTENT="See logs:%0Ahttps://github.com/xiwangone/rikkahub-agents/actions/runs/${{ github.run_id }}"
          fi
          curl -s "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            -d "title=$TITLE" \
            -d "desp=$CONTENT" || true
