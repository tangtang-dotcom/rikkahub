name: 编译 APK · Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '自定义 Release tag（默认取 versionName，如 2.4.5-beta.1）'
        required: false
        type: string
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
      - '.github/dependabot.yml'
      - '.github/scripts/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: Ktlint 静态检查（不阻断，输出风格报告）
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/latest/download/ktlint
          chmod +x ktlint
          ./ktlint app/src/main/java 2>&1 | tail -30 || true

      - name: 缓存 Gradle（依赖/编译缓存，加速构建）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 安装 bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

      - name: 固定签名构建 (overwrite-install)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$HOME/rikkahub.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "storeFile=$KEYSTORE" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --parallel --configure-on-demand

      - name: 编译单元测试（验证测试代码可编译，不执行）
        run: |
          ./gradlew compileDebugUnitTestKotlin --parallel --configure-on-demand || true

      - name: 重命名 APK（RikkaHub-Agents-架构命名）
        run: |
          cd app/build/outputs/apk/release
          for apk in app-*.apk; do
            [ -f "$apk" ] && mv "$apk" "RikkaHub-Agents-${apk#app-}" || true
          done

      - name: 上传 APK (artifact)
        # 先保产物：发版（下一步）失败也不丢 APK；artifact 永远存在供下载实测
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: app/build/outputs/apk/release/*.apk

      - name: 上传 APK 到 Release
        # push 与 workflow_dispatch 都尝试发版：push 时仅当 versionName 无对应 Release 才自动创建
        # （自动发版闭环：push 新版本号 → 构建 → Release → App 检查更新可检测）；
        # 已存在则跳过创建，仅刷新上传（workflow_dispatch 手动 release_tag 覆盖时同理）。
        run: |
          # 动态读取 versionName 作为默认 tag，可用 workflow_dispatch 的 release_tag 覆盖
          # 注：sed 捕获组在 YAML 转义易坏（\\1 变字面量），改用 awk 提取引号内版本号
          DEFAULT_TAG=$(awk -F'"' '/versionName/{print $2; exit}' app/build.gradle.kts)
          TAG="${RELEASE_TAG:-$DEFAULT_TAG}"
          echo "Release TAG: $TAG"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # push 自动发版：Release 已存在则跳过（避免每 push 都重建同名 Release）
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG 已存在，push 自动发版跳过（如需更新请手动 workflow_dispatch）"
              exit 0
            fi
          fi
          # Release 不存在则创建（避免 release not found）——保持统一样式
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "🚀 RikkaHub Agents $TAG" \
            --notes "$(git log --oneline --no-merges $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~10)..HEAD 2>/dev/null | head -40 | sed 's/^/- /' || echo '## ✨ v$TAG\n\n### 📦 安装包\n- ARM64 优化包\n- Universal 通用包')" || true
          cd app/build/outputs/apk/release
                    for apk in *.apk; do
            # 文件已在上一步统一重命名（RikkaHub-Agents-*），直接上传
            gh release upload "$TAG" "$apk" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Telegram 构建通知
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          MSG="${EMOJI} RikkaHub Agents 构建 ${STATUS}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}
          ${URL}" || true

      - name: 构建失败通知（Server酱）
        if: failure()
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SC_KEY" ]; then
            echo "未配置 SERVERCHAN_KEY，跳过通知"
            exit 0
          fi
          MSG="RikkaHub Agents 构建失败 #${{ github.run_number }}"
          DESP="commit: ${{ github.sha }}%0A%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://sctapi.ftqq.com/${SC_KEY}.send" \
            -d "title=${MSG}" -d "desp=${DESP}" | head -c 200
          echo
