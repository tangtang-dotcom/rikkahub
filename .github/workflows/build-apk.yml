name: 🤖 编译 APK · Release 优化版 · AI 自动构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: 缓存签名密钥
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: ~/rikkahub.jks
          key: keystore-v1

      - name: 生成签名密钥（仅首次）
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore ~/rikkahub.jks \
            -alias rikkahub -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=RikkaHub, OU=Dev, O=xiwangone, L=Beijing, ST=Beijing, C=CN"

      - name: 编译并签名 APK
        run: |
          echo "storeFile=$HOME/rikkahub.jks" > local.properties
          echo "storePassword=android" >> local.properties
          echo "keyAlias=rikkahub" >> local.properties
          echo "keyPassword=android" >> local.properties
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: app/build/outputs/apk/release/*.apk

      - name: 发送微信通知
        if: always() && (github.triggering_actor == 'xiwangone' || github.triggering_actor == 'github-actions')
        env:
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = "success" ]; then
            TITLE="✅ RikkaHub Agent 手动构建成功"
            CONTENT="APK 已上传到构建产物。%0A%0A下载：https://github.com/xiwangone/rikkahub-agents/actions/runs/${{ github.run_id }}"
          else
            TITLE="❌ RikkaHub Agent 手动构建失败"
            CONTENT="编译失败。%0A%0A日志：https://github.com/xiwangone/rikkahub-agents/actions/runs/${{ github.run_id }}"
          fi
          curl -s "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_KEY }}.send" \
            -d "title=$TITLE" \
            -d "desp=$CONTENT"
