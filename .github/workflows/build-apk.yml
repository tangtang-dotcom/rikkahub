name: 编译 APK · Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

      - name: 固定签名构建 (overwrite-install)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE="$HOME/rikkahub.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          echo "storeFile=$KEYSTORE" >> local.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> local.properties
          echo "keyAlias=$KEY_ALIAS" >> local.properties
          echo "keyPassword=$KEY_PASSWORD" >> local.properties
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 上传 APK 到 Release
        run: |
          TAG="2.4.3"
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            name=$(echo "$apk" | sed 's/app-/rikkahub-agents-'"$TAG"'-/')
            gh release upload "$TAG" "$apk" --clobber
            echo "Uploaded $name"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: app/build/outputs/apk/release/*.apk

