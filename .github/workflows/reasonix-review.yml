name: Reasonix 审查

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/*.yml'
  workflow_dispatch:
    inputs:
      fix:
        description: 'true=审查后自动修复（reasonix 改代码 + gradle 编译 + push）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 并发控制：同一时间仅跑一个 review/fix，避免服务器 /root/repo 互相踩踏
concurrency:
  group: reasonix-review
  cancel-in-progress: false

jobs:
  reasonix-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SSH 到服务器运行 reasonix 审查
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_REVIEW_KEY: ${{ secrets.ECS_REVIEW_KEY }}
          # 精确到本次 push 的 commit，避免服务器 git pull 拉到更新的 master 造成审查偏差
          REVIEW_SHA: ${{ github.sha }}
        run: |
          if [ -z "$ECS_HOST" ] || [ -z "$ECS_USER" ] || [ -z "$ECS_REVIEW_KEY" ]; then
            echo "::warning::未配置 ECS_HOST/ECS_USER/ECS_REVIEW_KEY Secrets，跳过 review"
            echo "SKIPPED_NO_SECRETS" > review_result.txt
            exit 0
          fi
          # 写入临时私钥（密钥认证；服务器密码认证已禁用，2026-08-09 起改用密钥）
          echo "$ECS_REVIEW_KEY" > /tmp/review_key
          chmod 600 /tmp/review_key
          # review 以 HEAD~1（父提交）为 base，对比本次 commit 的变更。
          # 捕获 review 退出码 rc；恢复 master（-f 丢弃残留文件）用 || true 隔离恢复失败；
          # 最后 exit $rc 保留原始失败信号，避免被恢复命令吞掉（review 失败 → workflow 失败）
          # 注意：review 命令内部调 skill 被权限阻止，改用 run 收集（2026-08-05 纪律）
          # 模型用 open-reasonix 付费通道（zen 免费限流导致 429，2026-08-09 切付费）
          ssh -i /tmp/review_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "$ECS_USER@$ECS_HOST" \
            "cd /root/repo && git fetch origin master && git checkout --force $REVIEW_SHA && \
             reasonix run --model open-reasonix/deepseek-v4-flash --permission-mode acceptEdits --effort high --max-steps 30 \"审查 HEAD~1..HEAD 的改动，输出 Blocking/Should-fix 问题清单，写入 /tmp/review.txt\"; rc=\$?; \
             git checkout -f -B master origin/master || true; exit \$rc" > review_result.txt 2>&1 \
            || echo "REVIEW_FAILED" >> review_result.txt
          echo "=== review 结果（前 60 行）==="
          head -60 review_result.txt

      - name: 上传 review 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reasonix-review
          path: review_result.txt

  reasonix-fix:
    # 仅手动触发且 fix=true 时执行修复闭环（双保险：inputs 上下文在 job-level if 可能不可用）
    if: inputs.fix == 'true' || github.event.inputs.fix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SSH 到服务器修复 + 编译 + 提交
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_REVIEW_KEY: ${{ secrets.ECS_REVIEW_KEY }}
        run: |
          if [ -z "$ECS_HOST" ] || [ -z "$ECS_USER" ] || [ -z "$ECS_REVIEW_KEY" ]; then
            echo "::warning::未配置 ECS secrets，跳过修复"
            exit 0
          fi
          echo "$ECS_REVIEW_KEY" > /tmp/review_key
          chmod 600 /tmp/review_key
          ssh -i /tmp/review_key -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            "$ECS_USER@$ECS_HOST" 'bash -s' << 'REMOTE_EOF'
            set -e
            cd /root/repo
            git fetch origin master
            git checkout -f -B master origin/master
            # 1. review 收集问题清单（用 run+acceptEdits 替代 review 命令：review 内部调 skill 会被权限阻止）
            #    不带 --continue：审查基于干净会话，避免复用上次运行遗留会话造成上下文污染（仅修复步骤 --continue 接续本次审查会话）
            reasonix run --model open-reasonix/deepseek-v4-flash --permission-mode acceptEdits --effort high "审查 HEAD~1..HEAD 的改动，输出 Blocking/Should-fix 问题清单，写入 /tmp/review.txt" || true
            echo "=== 审查结果（前 40 行）==="
            head -40 /tmp/review.txt
            # 审查阶段只读：丢弃审查过程中对仓库的任何意外改动（仅产出 /tmp/review.txt，不影响该文件）
            git checkout -f -- .
            # 2. reasonix 按审查结果修复（acceptEdits：自动批准文件编辑+bash；--continue 复用会话；--effort high 深入分析；--profile delivery 最高质量）
            reasonix run --model open-reasonix/deepseek-v4-flash --permission-mode acceptEdits --continue --effort high --max-steps 50 --profile delivery "请根据 /tmp/review.txt 中的审查结论，修复其中所有 Blocking 和 Should-fix 问题。只修改必要的文件，不要改动无关代码。修复完成后停在此处，不要 commit。"
            # 3. 提交并推送（不带 [skip ci]，push 后由 build-apk 编译验证 + reasonix-review 二轮审查把关）
            git add -A
            git commit -m "fix: Reasonix 审查后自动修复" || echo "无变更可提交"
            git push origin master
          REMOTE_EOF
          echo "=== 修复闭环完成 ==="

      - name: 上传修复日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reasonix-fix-log
          path: /dev/null
