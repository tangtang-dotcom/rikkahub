name: Merge Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_OFFICIAL_REPO: rikkahub/rikkahub
  UPSTREAM_OFFICIAL_BRANCH: master
  UPSTREAM_EXTV_REPO: ExTV/rikkahub-agent
  UPSTREAM_EXTV_BRANCH: master

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      merge_status: ${{ steps.merge.outputs.merge_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          # PAT_TOKEN can push workflow files; falls back to GITHUB_TOKEN
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Add upstream remotes
        run: |
          git remote add upstream-official https://github.com/${{ env.UPSTREAM_OFFICIAL_REPO }}.git
          git remote add upstream-extv https://github.com/${{ env.UPSTREAM_EXTV_REPO }}.git
          git fetch upstream-official --tags
          git fetch upstream-extv --tags

      - name: Check for upstream updates
        id: check
        run: |
          CURRENT=$(git rev-parse HEAD)
          OFFICIAL=$(git rev-parse upstream-official/${{ env.UPSTREAM_OFFICIAL_BRANCH }})
          EXTV=$(git rev-parse upstream-extv/${{ env.UPSTREAM_EXTV_BRANCH }})
          echo "current=$CURRENT"
          echo "official=$OFFICIAL"
          echo "extv=$EXTV"
          # Track official as primary; log ExTV only
          if [ "$CURRENT" != "$OFFICIAL" ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge official upstream
        id: merge
        if: steps.check.outputs.has_update == 'true'
        run: |
          set -e
          git config user.name "Auto Merge Bot"
          git config user.email "bot@rikkahub-agents.local"

          echo "=== merge official upstream ==="
          git merge upstream-official/${{ env.UPSTREAM_OFFICIAL_BRANCH }} --no-commit --no-ff 2>&1 || true

          CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
          if [ -n "$CONFLICTS" ]; then
            echo "=== resolve conflicts ==="
            OURS_COUNT=0
            THEIRS_COUNT=0
            for f in $CONFLICTS; do
              if git ls-tree upstream-official/${{ env.UPSTREAM_OFFICIAL_BRANCH }} "$f" 2>/dev/null | grep -q .; then
                echo "  [theirs] $f"
                git checkout --theirs "$f" 2>/dev/null || true
                THEIRS_COUNT=$((THEIRS_COUNT + 1))
              else
                echo "  [ours]   $f"
                git checkout --ours "$f" 2>/dev/null || true
                OURS_COUNT=$((OURS_COUNT + 1))
              fi
              git add "$f" 2>/dev/null || true
            done
            echo "=== done: official=$THEIRS_COUNT fork-only=$OURS_COUNT ==="
          else
            echo "=== no conflicts ==="
          fi

          REMAINING=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
          if [ -n "$REMAINING" ]; then
            echo "=== unresolved conflicts remain ==="
            echo "merge_status=failure_conflict" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          for f in close-blank-issues.yml daily-build.yml; do
            [ -f ".github/workflows/$f" ] && git rm -f ".github/workflows/$f" 2>/dev/null || true
          done
          git add -A 2>/dev/null || true

          git commit -m "chore: merge upstream rikkahub/rikkahub" --no-edit 2>&1 || true
          echo "merge_status=success" >> "$GITHUB_OUTPUT"
          git push origin master 2>&1
          echo "=== push ok ==="

      - name: No update
        if: steps.check.outputs.has_update != 'true'
        run: |
          echo "upstream unchanged; skip"
          echo "merge_status=skipped" >> "$GITHUB_OUTPUT"

  build:
    needs: check-and-merge
    if: ${{ needs.check-and-merge.outputs.has_update == 'true' && needs.check-and-merge.outputs.merge_status == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          ref: master

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Sign and build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/rikkahub.jks"
          {
            echo "storeFile=$HOME/rikkahub.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > local.properties
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Notify build status
        if: always()
        env:
          STATUS: ${{ job.status }}
          MERGE_STATUS: ${{ needs.check-and-merge.outputs.merge_status }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SERVERCHAN_KEY" ]; then
            echo "SERVERCHAN_KEY not set; skip notification"
            exit 0
          fi
          if [ "$STATUS" = "success" ]; then
            MSG="Merge + build OK.%0A%0Ahttps://github.com/xiwangone/rikkahub-agents/actions/runs/${{ github.run_id }}"
          elif [ "$MERGE_STATUS" = "failure_conflict" ]; then
            MSG="Merge conflict; manual fix required.%0A%0Ahttps://github.com/xiwangone/rikkahub-agents/actions/runs/${{ github.run_id }}"
          else
            MSG="Build failed.%0A%0Ahttps://github.com/xiwangone/rikkahub-agents/actions/runs/${{ github.run_id }}"
          fi
          curl -s "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            -d "title=RikkaHub Agents: upstream workflow" \
            -d "desp=$MSG" || true
