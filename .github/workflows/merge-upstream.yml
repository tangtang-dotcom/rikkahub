name: 合并上游 · Merge Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  actions: write

env:
  OFFICIAL_REPO: rikkahub/rikkahub
  OFFICIAL_BRANCH: master
  AGENT_REPO: ExTV/rikkahub-agent
  AGENT_BRANCH: master

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.sync.outputs.should_build }}
      official_updated: ${{ steps.sync.outputs.official_updated }}
      agent_updated: ${{ steps.sync.outputs.agent_updated }}
      agent_mode: ${{ steps.sync.outputs.agent_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: 检查并合并双上游 · Check and merge upstreams
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Auto Merge Bot"
          git config user.email "bot@rikkahub-agents.local"
          git remote add official "https://github.com/${OFFICIAL_REPO}.git"
          git remote add agent "https://github.com/${AGENT_REPO}.git"
          git fetch official "${OFFICIAL_BRANCH}" --tags
          git fetch agent "${AGENT_BRANCH}" --tags

          START_HEAD=$(git rev-parse HEAD)
          STATE_FILE=".github/upstream-versions.json"
          OFFICIAL_UPDATED=false
          AGENT_UPDATED=false
          AGENT_MODE=none
          SHOULD_BUILD=false

          normalize_version() {
            printf '%s' "$1" | sed -E 's/^[vV]//; s/-agent\././; s/[^0-9.].*$//'
          }
          version_gt() {
            local left right
            left=$(normalize_version "$1")
            right=$(normalize_version "$2")
            [ -n "$left" ] && [ -n "$right" ] && [ "$left" != "$right" ] &&               [ "$(printf '%s\n%s\n' "$left" "$right" | sort -V | tail -n1)" = "$left" ]
          }
          latest_release() {
            local repo="$1" fallback_ref="$2" release
            release=$(curl -fsSL "https://api.github.com/repos/${repo}/releases/latest" |               python3 -c 'import json,sys; print(json.load(sys.stdin).get("tag_name", ""))' 2>/dev/null || true)
            if [ -n "$release" ]; then
              printf '%s' "$release"
            else
              git tag --merged "$fallback_ref" --list | grep -E '^[vV]?[0-9]+(\.[0-9]+)+(\-agent\.[0-9]+)?$' | sort -V | tail -n1
            fi
          }
          OFFICIAL_VERSION=$(latest_release "$OFFICIAL_REPO" "official/${OFFICIAL_BRANCH}")
          AGENT_VERSION=$(latest_release "$AGENT_REPO" "agent/${AGENT_BRANCH}")
          OFFICIAL_REF="refs/tags/${OFFICIAL_VERSION}"
          AGENT_REF="refs/tags/${AGENT_VERSION}"
          LAST_OFFICIAL=$(python3 -c 'import json; print(json.load(open(".github/upstream-versions.json"))["official"]["last_processed_version"])')
          LAST_AGENT=$(python3 -c 'import json; print(json.load(open(".github/upstream-versions.json"))["agent"]["last_processed_version"])')
          OFFICIAL_RELEASED=false
          AGENT_RELEASED=false
          version_gt "$OFFICIAL_VERSION" "$LAST_OFFICIAL" && OFFICIAL_RELEASED=true || true
          version_gt "$AGENT_VERSION" "$LAST_AGENT" && AGENT_RELEASED=true || true
          echo "official release: $LAST_OFFICIAL -> ${OFFICIAL_VERSION:-none}"
          echo "agent release: $LAST_AGENT -> ${AGENT_VERSION:-none}"

          # Merge official updates first. Stop on real conflicts instead of
          # silently discarding fork functionality.
          if [ "$OFFICIAL_RELEASED" = true ]; then
            OFFICIAL_UPDATED=true
            SHOULD_BUILD=true
            echo "Official updates detected; merging official first"
            if ! git merge "$OFFICIAL_REF" --no-ff --no-edit; then
              git merge --abort || true
              echo "Official merge has conflicts; manual review required"
              exit 1
            fi
          else
            echo "Official upstream is already contained"
          fi

          if [ "$AGENT_RELEASED" = true ]; then
            AGENT_UPDATED=true
            SHOULD_BUILD=true
            UNIQUE_AGENT_PATCHES=$(git cherry HEAD "$AGENT_REF" | awk '$1 == "+" {count++} END {print count+0}')
            if [ "$UNIQUE_AGENT_PATCHES" -eq 0 ]; then
              AGENT_MODE=equivalent
              echo "Agent update is patch-equivalent to current/official code"
              git merge "$AGENT_REF" -s ours --no-ff --no-edit
            else
              AGENT_MODE=merge
              echo "Agent has $UNIQUE_AGENT_PATCHES unique patch(es); merging after official"
              if ! git merge "$AGENT_REF" --no-ff --no-edit; then
                git merge --abort || true
                echo "Agent differs from official and has conflicts; manual review required"
                exit 1
              fi
            fi
          else
            echo "Agent upstream is already contained"
          fi

          # Block Release when a merged feature introduces untranslated UI.
          python3 .github/scripts/check-new-localization.py "$START_HEAD" HEAD

          # Keep this fork's language, signing, notification and CI policy.
          git checkout "$START_HEAD" -- \
            README.md README_EN.md .github/upstream-versions.json \
            .github/workflows/build-apk.yml \
            .github/workflows/codeql.yml \
            .github/workflows/issue-notify.yml \
            .github/workflows/merge-upstream.yml
          for file in close-blank-issues.yml daily-build.yml; do
            [ ! -e ".github/workflows/$file" ] || git rm -f ".github/workflows/$file"
          done
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore fork-owned configuration after upstream sync"
          fi

          python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); d["official"]["last_processed_version"]=sys.argv[2] if sys.argv[4]=="true" else d["official"]["last_processed_version"]; d["agent"]["last_processed_version"]=sys.argv[3] if sys.argv[5]=="true" else d["agent"]["last_processed_version"]; open(p,"w").write(json.dumps(d,ensure_ascii=False,indent=2)+"\n")' "$STATE_FILE" "$OFFICIAL_VERSION" "$AGENT_VERSION" "$OFFICIAL_UPDATED" "$AGENT_UPDATED"
          git add "$STATE_FILE"
          if ! git diff --cached --quiet; then
            git commit -m "chore: record processed upstream releases"
          fi

          echo "official_updated=$OFFICIAL_UPDATED" >> "$GITHUB_OUTPUT"
          echo "agent_updated=$AGENT_UPDATED" >> "$GITHUB_OUTPUT"
          echo "agent_mode=$AGENT_MODE" >> "$GITHUB_OUTPUT"
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_BUILD" = true ]; then
            git push origin master
          else
            echo "Both upstreams are current; no push or build"
          fi

      - name: 同步失败通知 · Notify sync failure
        if: failure()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SERVERCHAN_KEY" ]; then
            echo "SERVERCHAN_KEY not set; skip notification"
            exit 0
          fi
          curl -s "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            -d "title=RikkaHub Agents: upstream sync failed" \
            -d "desp=Manual conflict review required.%0A%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true

  build:
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          submodules: true
      - name: 配置 JDK 17 · Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 配置 Android SDK · Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: 配置 pnpm · Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: 安装 Web 依赖 · Install web dependencies
        working-directory: web-ui
        run: pnpm --ignore-workspace install --frozen-lockfile
      - name: 签名并编译 · Sign and build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/rikkahub.jks"
          {
            echo "storeFile=$HOME/rikkahub.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > local.properties
          ./gradlew assembleRelease --no-daemon
      - name: 上传 APK · Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agents-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: 构建结果通知 · Notify build result
        if: always()
        env:
          STATUS: ${{ job.status }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SERVERCHAN_KEY" ]; then
            echo "SERVERCHAN_KEY not set; skip notification"
            exit 0
          fi
          curl -s "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            -d "title=RikkaHub Agents: upstream build ${STATUS}" \
            -d "desp=official=${{ needs.sync.outputs.official_updated }}, agent=${{ needs.sync.outputs.agent_updated }}, mode=${{ needs.sync.outputs.agent_mode }}%0A%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
