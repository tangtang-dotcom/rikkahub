name: 合并上游代码

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: rikkahub/rikkahub
  UPSTREAM_BRANCH: master

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      has_conflict: ${{ steps.merge.outputs.has_conflict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 添加上游
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream --tags

      - name: 检查更新
        id: check
        run: |
          CURRENT=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})
          if [ "$CURRENT" != "$UPSTREAM" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: 合并代码
        id: merge
        if: steps.check.outputs.has_update == 'true'
        run: |
          git config user.name "Auto Merge Bot"
          git config user.email "bot@rikkahub-agents.local"
          if git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit 2>&1; then
            echo "has_conflict=false" >> $GITHUB_OUTPUT
            git push origin master 2>&1
          else
            echo "has_conflict=true" >> $GITHUB_OUTPUT
            git merge --abort
            echo "::error::合并冲突，请手动处理"
            exit 1
          fi

      - name: 无更新
        if: steps.check.outputs.has_update != 'true'
        run: echo "上游无新版本，跳过"