name: 合并上游代码

on:
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'true=检查到更新后自动合并并推送；false=仅检查并通知（默认）'
        required: false
        default: false
        type: boolean
  schedule:
    # 每日 02:00 UTC（北京时间 10:00）自动检查上游是否有更新（仅检查+通知，不自动合并）
    - cron: '0 2 * * *'

permissions:
  contents: write

env:
  UPSTREAM_REPO: rikkahub/rikkahub
  UPSTREAM_BRANCH: master

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      has_conflict: ${{ steps.merge.outputs.has_conflict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 添加上游
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git
          git fetch upstream --tags

      - name: 检查更新
        id: check
        run: |
          CURRENT=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})
          if [ "$CURRENT" != "$UPSTREAM" ]; then
            echo "has_update=true" >> $GITHUB_OUTPUT
            echo "CURRENT=$CURRENT" >> $GITHUB_OUTPUT
            echo "UPSTREAM=$UPSTREAM" >> $GITHUB_OUTPUT
          else
            echo "has_update=false" >> $GITHUB_OUTPUT
          fi

      - name: 上游更新通知（Server酱，仅定时/仅检查模式）
        if: steps.check.outputs.has_update == 'true' && github.event_name == 'schedule'
        env:
          SC_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -z "$SC_KEY" ]; then
            echo "未配置 SERVERCHAN_KEY，跳过通知"
            exit 0
          fi
          MSG="上游 rikkahub 有新提交（每日检查）"
          DESP="上游 master 有新提交，请手动评估是否合并（我方有意剔除赞助商/OCR 等功能，自动合并可能引入冲突）。%0A%0A查看: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://sctapi.ftqq.com/${SC_KEY}.send" \
            -d "title=${MSG}" -d "desp=${DESP}" | head -c 200
          echo

      - name: 合并代码
        id: merge
        if: steps.check.outputs.has_update == 'true' && (github.event_name == 'workflow_dispatch' && inputs.auto_merge == 'true')
        run: |
          git config user.name "Auto Merge Bot"
          git config user.email "bot@rikkahub-agents.local"
          if git merge upstream/${{ env.UPSTREAM_BRANCH }} --no-edit 2>&1; then
            echo "has_conflict=false" >> $GITHUB_OUTPUT
            git push origin master 2>&1
          else
            echo "has_conflict=true" >> $GITHUB_OUTPUT
            git merge --abort
            echo "::error::合并冲突，请手动处理"
            exit 1
          fi

      - name: 无更新
        if: steps.check.outputs.has_update != 'true'
        run: echo "上游无新版本，跳过"
