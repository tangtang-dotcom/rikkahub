name: Eta Formal Release Build

on:
  push:
    branches:
      - feature/eta-agent-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-formal-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare signed release inputs
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$KEY_BASE64" ] && [ -n "$SIGNING_CONFIG" ]; then
            printf '%s' "$KEY_BASE64" | base64 -d > app/app.key
            printf '%s\n' "$SIGNING_CONFIG" > local.properties
            SIGNING_MODE=official
          else
            echo "Official signing secrets are not configured; generating a CI-only release keystore."
            keytool -genkeypair -v \
              -keystore app/app.key \
              -storepass ci-release-password \
              -keypass ci-release-password \
              -alias rikkahub-ci-release \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "CN=RikkaHub CI Release, OU=CI, O=RikkaHub, C=US"
            cat > local.properties <<'PROPS'
          storeFile=app.key
          storePassword=ci-release-password
          keyAlias=rikkahub-ci-release
          keyPassword=ci-release-password
          PROPS
            SIGNING_MODE=ci-only
          fi

          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "Production Google Services secret is not configured; using a build-only test configuration."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "rikkahub-formal-build",
              "storage_bucket": "rikkahub-formal-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "api_key": [{ "current_key": "AIzaSyDUMMY_DUMMY_DUMMY_DUMMY_DUMMY" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1111111111111111",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "api_key": [{ "current_key": "AIzaSyDUMMY_DUMMY_DUMMY_DUMMY_DUMMY" }]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

          printf 'signing=%s\n' "$SIGNING_MODE" > formal-build-mode.txt

      - name: Run JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain

      - name: Build optimized APK and AAB with R8
        run: |
          ./gradlew buildAll --no-daemon --stacktrace --console=plain

      - name: Verify R8 optimization outputs
        run: |
          test -s app/build/outputs/mapping/release/mapping.txt
          printf 'R8=enabled\nresource_shrinking=enabled_by_agp_9_3_optimization\n' > r8-verification.txt
          find app/build/outputs/mapping/release -maxdepth 1 -type f -printf '%f\n' | sort >> r8-verification.txt

      - name: Collect release artifacts and checksums
        run: |
          mkdir -p formal-release
          find app/build/outputs/apk/release -type f -name '*.apk' -exec cp {} formal-release/ ';'
          find app/build/outputs/bundle/release -type f -name '*.aab' -exec cp {} formal-release/ ';'
          cp r8-verification.txt formal-release/R8-VERIFICATION.txt
          cp app/build/outputs/mapping/release/mapping.txt formal-release/mapping.txt
          sha256sum formal-release/* > formal-release/SHA256SUMS.txt
          printf 'commit=%s\nversion=2.4.12\nversionCode=179\n' '${{ github.sha }}' > formal-release/BUILD-INFO.txt

      - name: Upload formal release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-formal-release-2.4.12-${{ github.sha }}
          path: formal-release/
          if-no-files-found: error
          retention-days: 30

      - name: Run release lint (advisory)
        continue-on-error: true
        run: |
          timeout 10m ./gradlew lintRelease --no-daemon --stacktrace --console=plain
