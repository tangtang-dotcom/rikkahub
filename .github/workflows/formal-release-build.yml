name: Eta Formal Release Build

on:
  push:
    branches:
      - feature/eta-agent-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-formal-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare signed release inputs
        run: |
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Run unit tests and release lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease --no-daemon --stacktrace --console=plain

      - name: Build optimized APK and AAB
        run: |
          ./gradlew buildAll --no-daemon --stacktrace --console=plain

      - name: Collect release artifacts and checksums
        run: |
          mkdir -p formal-release
          find app/build/outputs/apk/release -type f -name '*.apk' -exec cp {} formal-release/ \;
          find app/build/outputs/bundle/release -type f -name '*.aab' -exec cp {} formal-release/ \;
          sha256sum formal-release/* > formal-release/SHA256SUMS.txt
          printf 'commit=%s\nversion=2.4.12\nversionCode=179\n' '${{ github.sha }}' > formal-release/BUILD-INFO.txt

      - name: Upload formal release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-formal-release-2.4.12-${{ github.sha }}
          path: formal-release/
          if-no-files-found: error
          retention-days: 30
