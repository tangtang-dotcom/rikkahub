name: RikkaHub Eta Integration Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-root-terminal
      - feature/eta-agent-integration

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Avoid broken committed Gradle daemon toolchain pin
        run: rm -f gradle/gradle-daemon-jvm.properties

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Create test Firebase configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "rikkahub-root-test",
              "storage_bucket": "rikkahub-root-test.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "api_key": [{ "current_key": "AIzaSyDUMMY_DUMMY_DUMMY_DUMMY_DUMMY" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1111111111111111",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "api_key": [{ "current_key": "AIzaSyDUMMY_DUMMY_DUMMY_DUMMY_DUMMY" }]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          test -s app/google-services.json
          mkdir -p app/src/debug
          cp app/google-services.json app/src/debug/google-services.json
          test -s app/src/debug/google-services.json

      - name: Run JVM unit tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon

      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-jvm-test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build debug APK
        id: build_apk
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee gradle-build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-gradle-build-log-${{ github.sha }}
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if APK build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Collect APKs
        run: |
          mkdir -p root-terminal-apk
          find app/build/outputs/apk/debug -type f -name '*.apk' -exec cp {} root-terminal-apk/ \;
          sha256sum root-terminal-apk/*.apk > root-terminal-apk/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-eta-integration-debug-${{ github.sha }}
          path: root-terminal-apk/
          if-no-files-found: error
          retention-days: 14
