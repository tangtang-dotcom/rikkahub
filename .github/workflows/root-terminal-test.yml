name: Root Terminal Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-root-terminal

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Create test Firebase configuration
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "rikkahub-root-test",
              "storage_bucket": "rikkahub-root-test.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:0000000000000000",
                  "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "api_key": [{ "current_key": "AIzaSyDUMMY_DUMMY_DUMMY_DUMMY_DUMMY" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1111111111111111",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.debug" }
                },
                "api_key": [{ "current_key": "AIzaSyDUMMY_DUMMY_DUMMY_DUMMY_DUMMY" }]
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p root-terminal-apk
          find app/build/outputs/apk/debug -type f -name '*.apk' -exec cp {} root-terminal-apk/ \;
          sha256sum root-terminal-apk/*.apk > root-terminal-apk/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-root-terminal-debug-${{ github.sha }}
          path: root-terminal-apk/
          if-no-files-found: error
          retention-days: 14
