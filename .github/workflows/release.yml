name: 发布 Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag（必填，如 2.45.8 / 2.45.7.2）'
        required: true
        type: string
      prerelease:
        description: '标记为预发布（默认 true；正式版取消勾选）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 安装 bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

      - name: 固定签名构建 (overwrite-install)
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > keystore.jks
            sed -i "s|keystore.properties|local.properties|" app/build.gradle.kts 2>/dev/null || true
            cat > local.properties <<EOF
            sdk.dir=$ANDROID_HOME
            keystore.path=$GITHUB_WORKSPACE/keystore.jks
            keystore.password=$KEYSTORE_PASS
            keystore.alias=$KEYSTORE_ALIAS
            EOF
          fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}

      - name: 重命名 APK（RikkaHub-Agents-版本号-架构命名）
        run: |
          VER="${{ inputs.release_tag }}"
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            case "$apk" in
              *arm64*) arch="arm64-v8a" ;;
              *universal*) arch="universal" ;;
              *) arch="$(basename "$apk" .apk)" ;;
            esac
            mv "$apk" "RikkaHub-Agents-${VER}-${arch}-release.apk"
          done
          ls -la

      - name: 创建/更新 Release 并上传
        run: |
          TAG="${{ inputs.release_tag }}"
          PRERELEASE="${{ inputs.prerelease }}"
          echo "Release TAG: $TAG (prerelease=$PRERELEASE)"
          # Release 已存在则保留（只刷新资产）；不存在则创建
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # 自动生成 notes：git log 按类型分组
            gh release create "$TAG" \
              --title "🚀 RikkaHub Agents $TAG" \
              --prerelease="$PRERELEASE" \
              --notes "$(git log --oneline --no-merges $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~10)..HEAD 2>/dev/null | head -60 | awk '
                function classify(msg,    m) {
                  if (msg ~ /^feat|^✨/) return "✨ 新增"
                  if (msg ~ /^fix|^🐛/) return "🔨 修复"
                  if (msg ~ /^ci|^chore|^🔧/) return "🔧 维护"
                  return "📝 其他"
                }
                {
                  msg = $0; sub(/^[0-9a-f]+ /, "", msg)
                  cat = classify(msg)
                  items[cat] = items[cat] "\n- " msg
                }
                END {
                  order[1]="✨ 新增"; order[2]="🔨 修复"; order[3]="🔧 维护"; order[4]="📝 其他"
                  for (i=1; i<=4; i++) {
                    c = order[i]
                    if (items[c] != "") { print "### " c; print items[c]; print "" }
                  }
                }' || echo '## ✨ v$TAG')
          else
            echo "Release $TAG 已存在，仅刷新资产"
          fi
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            gh release upload "$TAG" "$apk" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
