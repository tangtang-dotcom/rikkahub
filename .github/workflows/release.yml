name: 发布 Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag（必填，如 2.45.8 / 2.45.7.2）'
        required: true
        type: string
      prerelease:
        description: '标记为预发布（默认 true；正式版取消勾选）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle 依赖（libs 变化才重建）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ runner.os }}-gradle-modules-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-modules-

      - name: 缓存 Gradle 构建缓存（固定 key，不堆积）
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache
          save-always: true

      - name: 安装 bun & pnpm
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          npm install -g pnpm

      - name: 发版时 bump 版本号（versionName/versionCode → release_tag）
        # 版本号由发版输入控制：构建前把 versionName 设为 release_tag，versionCode 递增
        run: |
          TAG="${{ inputs.release_tag }}"
          OLD_CODE=$(awk '/versionCode = /{print $3; exit}' app/build.gradle.kts)
          NEW_CODE=$((OLD_CODE + 1))
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$TAG\"/" app/build.gradle.kts
          sed -i "s/versionCode = $OLD_CODE/versionCode = $NEW_CODE/" app/build.gradle.kts
          echo "bump: versionName → $TAG, versionCode $OLD_CODE → $NEW_CODE"
          # 提交版本号推进（发版即改版本，push 触发 build-apk 仅编译验证）
          git config user.name "Release Bot"
          git config user.email "release@rikkahub-agents.local"
          git add app/build.gradle.kts
          git commit -m "chore: bump versionName=$TAG versionCode=$NEW_CODE（release.yml 发版）"
          git push origin master || true

      - name: 固定签名构建 (overwrite-install)
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > keystore.jks
            sed -i "s|keystore.properties|local.properties|" app/build.gradle.kts 2>/dev/null || true
            echo "sdk.dir=$ANDROID_HOME" > local.properties
            echo "keystore.path=$GITHUB_WORKSPACE/keystore.jks" >> local.properties
            echo "keystore.password=$KEYSTORE_PASS" >> local.properties
            echo "keystore.alias=$KEYSTORE_ALIAS" >> local.properties
          fi
          chmod +x gradlew
          # --build-cache 复用本地构建缓存；--configuration-cache 增量配置解析
          ./gradlew :app:assembleRelease --stacktrace --no-daemon --parallel --build-cache --configuration-cache
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}

      - name: 重命名 APK（RikkaHub-Agents-版本号-架构命名）
        run: |
          VER="${{ inputs.release_tag }}"
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            case "$apk" in
              *arm64*) arch="arm64-v8a" ;;
              *universal*) arch="universal" ;;
              *) arch="$(basename "$apk" .apk)" ;;
            esac
            mv "$apk" "RikkaHub-Agents-${VER}-${arch}-release.apk"
          done
          ls -la

      - name: 创建/更新 Release 并上传
        run: |
          TAG="${{ inputs.release_tag }}"
          PRERELEASE="${{ inputs.prerelease }}"
          echo "Release TAG: $TAG (prerelease=$PRERELEASE)"
          # Release 已存在则保留（只刷新资产）；不存在则创建
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # 自动生成 notes：git log 按类型分组
            gh release create "$TAG" \
              --title "🚀 RikkaHub Agents $TAG" \
              --prerelease="$PRERELEASE" \
              --notes "$(git log --oneline --no-merges $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~10)..HEAD 2>/dev/null | head -60 | awk '
                function classify(msg,    m) {
                  if (msg ~ /^feat|^✨/) return "✨ 新增"
                  if (msg ~ /^fix|^🐛/) return "🔨 修复"
                  if (msg ~ /^ci|^chore|^🔧/) return "🔧 维护"
                  return "📝 其他"
                }
                {
                  msg = $0; sub(/^[0-9a-f]+ /, "", msg)
                  cat = classify(msg)
                  items[cat] = items[cat] "\n- " msg
                }
                END {
                  order[1]="✨ 新增"; order[2]="🔨 修复"; order[3]="🔧 维护"; order[4]="📝 其他"
                  for (i=1; i<=4; i++) {
                    c = order[i]
                    if (items[c] != "") { print "### " c; print items[c]; print "" }
                  }
                }' || echo '## ✨ v$TAG')
          else
            echo "Release $TAG 已存在，仅刷新资产"
          fi
          cd app/build/outputs/apk/release
          for apk in *.apk; do
            gh release upload "$TAG" "$apk" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
