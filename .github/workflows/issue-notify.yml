name: 议题通知 · Issue Notify

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify on new issue
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$SERVERCHAN_KEY" ]; then
            echo "SERVERCHAN_KEY not set; skip"
            exit 0
          fi
          BODY_TRIM=$(printf '%s' "$ISSUE_BODY" | head -c 1500)
          TITLE="New issue: ${ISSUE_TITLE}"
          MSG="repo: ${REPO}%0A%0Aauthor: ${ISSUE_USER}%0A%0Abody: ${BODY_TRIM}%0A%0A${ISSUE_URL}"
          curl -s "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            -d "title=$TITLE" \
            -d "desp=$MSG" || true
