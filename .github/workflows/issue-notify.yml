name: 💬 议题通知

on:
  issues:
    types: [opened, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 发送通知
        run: |
          TITLE="💬 新议题：${{ github.event.issue.title }}"
          MSG="仓库：${{ github.repository }}%0A%0A作者：${{ github.event.issue.user.login }}%0A%0A内容：${{ github.event.issue.body }}%0A%0A链接：${{ github.event.issue.html_url }}"
          curl -s "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_KEY }}.send" \
            -d "title=$TITLE" \
            -d "desp=$MSG"
